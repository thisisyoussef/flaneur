name: Flaneur
options:
  bundleIdPrefix: com.youssefa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Flaneur:
    type: application
    platform: iOS
    sources:
      - path: Flaneur
    info:
      path: Flaneur/Info.plist
      properties:
        CFBundleDisplayName: Flâneur
        UILaunchScreen:
          UIColorName: AccentColor
        NSLocationWhenInUseUsageDescription: Flâneur uses your location to start your walk from where you are.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youssefa.flaneur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
